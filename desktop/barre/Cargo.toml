[package]
name = "barre"
description = "Barre du haut du desktop, ancrée par layer-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "tiny-skia",
    "svg",
    "web-colors",
    "crisp",
    "thread-pool",
    "wayland",
] }
iced_exwlshell = { version = "=0.21.4", default-features = false, features = ["macros"] }
sherlock-ui = { path = "../sherlock-ui" }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[dev-dependencies]
iced_test = "=0.14.0"

[lints]
workspace = true
