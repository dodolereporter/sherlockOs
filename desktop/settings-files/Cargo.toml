[package]
name = "settings-files"
description = "The settings files of the desktop, read and written the same way by Control Room and Sherlock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Out of Control Room (lot A-17), without iced, so that Sherlock's settings server changes the
# files by the same functions: each file's own parser and writer, and the one safe writer of
# settings files (workspace crates).
[dependencies]
appearance-config = { path = "../appearance-config" }
desktop-config = { path = "../desktop-config" }
dock-config = { path = "../dock-config" }
mime-apps = { path = "../mime-apps" }
tracing = "=0.1.44"

[lints]
workspace = true
