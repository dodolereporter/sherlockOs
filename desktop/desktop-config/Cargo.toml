[package]
name = "desktop-config"
description = "Settings of the desktop shared by the compositor and Control Room: the wallpaper, the touchpad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The variant generator (`wallpaper-variants`), run when the image is built, needs
# an image codec. Control Room only reads the settings.
variants = ["dep:image"]
# The picture behind the lock and login screens (`lock_background`): the lock screen, the login
# screen and the compositor, which draws it as their curtain (lot D-24e), read it alike.
lock-background = ["dep:image"]

[dependencies]
# PNG and JPEG only, version already used by evidence (and pulled by iced 0.14).
image = { version = "=0.25.10", optional = true, default-features = false, features = [
    "jpeg",
    "png",
] }
# The wallpaper index (ids, pairs between themes). Only the tokens, without iced.
sherlock-ui = { path = "../sherlock-ui", default-features = false }
thiserror = "=2.0.21"

[[bin]]
name = "wallpaper-variants"
required-features = ["variants"]

[lints]
workspace = true
