[package]
name = "evidence"
description = "Evidence, the file manager of the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Toolkit du shell (ADR 0014). Les fonctions de rendu viennent de sherlock-ui ; `thread-pool`
# est nommée ici parce que les copies et l'état git s'exécutent hors du fil de l'interface.
# `image-without-codecs` ouvre le widget image de l'aperçu, sans les dizaines de formats que
# tire la fonction `image` : seuls PNG et JPEG sont décodés (dépendance `image` ci-dessous).
iced = { version = "=0.14.0", default-features = false, features = [
    "image-without-codecs",
    "thread-pool",
] }
# Décodeurs de l'aperçu des images, PNG et JPEG seulement. Version tirée par iced 0.14.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
# Heure locale (localtime_r) pour les dates de la liste et de la corbeille. Déjà tirée par
# iced et winit : seule la déclaration est nouvelle.
libc = "=0.2.191"
sherlock-ui = { path = "../sherlock-ui" }
# UDisks2 on the system D-Bus: disks, USB keys, cards, mount, unmount, eject. Pure Rust, no
# libdbus. Only its default pair of features is kept, named explicitly: the blocking API (the
# watcher runs on its own thread) and its own small async-io executor (no tokio).
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[dev-dependencies]
# Rendu sans écran pour la capture et les tests de la souris, comme la galerie de D-01.
iced_test = "=0.14.0"
# Exécution des tâches de l'application dans les scénarios de test, sans fenêtre. Déjà tirés
# par iced : seules les déclarations sont nouvelles.
iced_runtime = "=0.14.0"
futures = "=0.3.34"
# Reads the UDisks2 objects recorded with `busctl --json` for the device tests. Same version
# as sherlockd.
serde_json = "=1.0.154"

[lints]
workspace = true
