[package]
name = "dock"
description = "Dock of the desktop, anchored at the bottom with layer-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The same as the bar (docs/bar.md).
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "tiny-skia",
    "svg",
    "web-colors",
    "crisp",
    "thread-pool",
    "wayland",
] }
iced_exwlshell = { version = "=0.21.4", default-features = false, features = ["macros"] }
dock-config = { path = "../dock-config" }
# Icon lookup shared with the launcher (workspace crate).
icon-theme = { path = "../icon-theme" }
# The theme of the appearance file, followed live (workspace crate).
appearance-config = { path = "../appearance-config" }
# inotify, to reload the configuration without polling: the version the bar already pins.
libc = "=0.2.191"
sherlock-ui = { path = "../sherlock-ui" }
# Client side of our compositor's private protocol (ADR 0021), for the windows of an application
# that starts (workspace crate).
shell-protocol = { path = "../shell-protocol", features = ["client"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }
# Client side of `zwlr_foreign_toplevel_manager_v1`, for the open windows: the versions that
# iced_exwlshell and smithay already pull.
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[dev-dependencies]
iced_test = "=0.14.0"
# A fake compositor for the window list test: the server side that smithay already pulls.
wayland-server = "=0.31.14"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client", "server"] }
# The server side of our protocol, for a fake compositor in the shell source test.
shell-protocol = { path = "../shell-protocol", features = ["client", "server"] }

[lints]
workspace = true
