[package]
name = "apps"
description = "Applications view of the desktop: every installed application in pages, a layer-shell overlay opened on demand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sherlockos-apps"
path = "src/main.rs"

[dependencies]
# Its connection to the shell socket, the only one that offers anchored surfaces (workspace
# crate, lot D-46).
shell-protocol = { path = "../shell-protocol", features = ["client"] }
# The same as the launcher (docs/launcher.md).
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "tiny-skia",
    "svg",
    "web-colors",
    "crisp",
    "thread-pool",
    "wayland",
    # The icons drawn once as pixels (lot P-02), without iced's picture decoders.
    "image-without-codecs",
] }
iced_exwlshell = { version = "=0.21.4", default-features = false, features = ["macros"] }
# The pinned list as the dock shows it, and its file (workspace crates).
dock = { path = "../dock" }
dock-config = { path = "../dock-config" }
# The wallpaper setting, to blur the wallpaper behind the view (workspace crate).
desktop-config = { path = "../desktop-config" }
# Application icons (workspace crate).
icon-theme = { path = "../icon-theme" }
# The launcher's reading of the applications, its search, its start without a shell and its
# single instance (workspace crate).
launcher = { path = "../launcher" }
# The data directories and the terminal (workspace crate).
mime-apps = { path = "../mime-apps" }
# `layer-shell`: its glass asks the compositor for the blur behind it (lot D-37b).
sherlock-ui = { path = "../sherlock-ui", features = ["layer-shell"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

# The wallpaper behind the view, decoded, blurred and kept in the cache (lot P-02c): the version
# and features the lock screen and the compositor already pin.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
# The errors of the backdrop: the version the launcher already pins.
thiserror = "=2.0.21"

[dev-dependencies]
iced_test = "=0.14.0"
# The `pages` example counts the SVG pictures iced_wgpu rasterizes, which it logs through `log`:
# the version iced already pulls.
log = "=0.4.35"

[lints]
workspace = true
