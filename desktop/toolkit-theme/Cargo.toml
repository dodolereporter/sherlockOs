[package]
name = "toolkit-theme"
description = "Colors of the desktop for third-party toolkits (GTK 3, GTK 4, Qt, KDE), installed and switched with the theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The theme followed live, and the local time of the backup names.
appearance-config = { path = "../appearance-config" }
# The names of the cursor themes, without the generator.
cursor-theme = { path = "../cursor-theme" }
# Every settings file of the desktop is read with a bound and written atomically the same way.
mime-apps = { path = "../mime-apps" }
# The palettes: the tokens only, without iced.
sherlock-ui = { path = "../sherlock-ui", default-features = false }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[lints]
workspace = true
