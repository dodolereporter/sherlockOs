[package]
name = "control-room"
description = "Control Room, the settings application of the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Shell toolkit (ADR 0014). The rendering functions come from sherlock-ui; `thread-pool` runs
# the reading of the wallpaper thumbnails off the interface thread, `image-without-codecs`
# draws them without the dozens of formats of the `image` feature (as Evidence does).
iced = { version = "=0.14.0", default-features = false, features = [
    "image-without-codecs",
    "thread-pool",
] }
# Decodes the wallpaper variants (PNG) for their thumbnails. The version and features
# Evidence pins.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
sherlock-ui = { path = "../sherlock-ui" }
# The settings files Control Room writes, each read live by its program (workspace crates).
appearance-config = { path = "../appearance-config" }
desktop-config = { path = "../desktop-config" }
dock-config = { path = "../dock-config" }
# Installed applications and default applications (`mimeapps.list`), and the one safe writer
# of settings files, shared with Evidence and the dock (workspace crate).
mime-apps = { path = "../mime-apps" }
# Outputs, microphones and their volumes through `pactl`, as the bar and the media keys
# (workspace crate).
system-services = { path = "../system-services" }
# The « Écrans » page talks `wlr-output-management` to the compositor on a connection of its own
# (ADR 0025): the versions the workspace already pulls, client side.
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[dev-dependencies]
# Headless rendering for the captures and the navigation tests, as Evidence.
iced_test = "=0.14.0"

[lints]
workspace = true
