[package]
name = "launcher"
description = "Application launcher of the desktop, a layer-shell overlay opened on demand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The theme of the appearance file, read once at start (workspace crate).
appearance-config = { path = "../appearance-config" }
# The same as the bar and the dock (docs/bar.md).
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "tiny-skia",
    "svg",
    "web-colors",
    "crisp",
    "thread-pool",
    "wayland",
] }
iced_exwlshell = { version = "=0.21.4", default-features = false, features = ["macros"] }
# `kill`, to close the launcher already open: the version the bar and the dock already pin.
libc = "=0.2.191"
# The pinned list as the dock shows it, and its file, for the menu that pins an application
# (workspace crates).
dock = { path = "../dock" }
dock-config = { path = "../dock-config" }
# Application icons (workspace crate).
icon-theme = { path = "../icon-theme" }
# The installed applications, and the default application of a file (workspace crate).
mime-apps = { path = "../mime-apps" }
sherlock-ui = { path = "../sherlock-ui" }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[dev-dependencies]
iced_test = "=0.14.0"
# The board of the typing (lot P-02d): its frames read and laid side by side. The version the
# compositor and the lock screen already pin, PNG only.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
