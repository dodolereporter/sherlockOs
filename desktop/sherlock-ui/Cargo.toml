[package]
name = "sherlock-ui"
description = "Colors, radii, typography and components shared by the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The shell programs want the components, so iced is on by default. The compositor, which
# only reads the tokens, goes without it with `default-features = false`.
default = ["iced"]
iced = ["dep:iced"]

[dependencies]
# Shell toolkit (ADR 0014). Software rendering only: without the `wgpu` feature, tiny-skia is
# the only renderer compiled, so no environment variable can wake the NVIDIA card.
# `svg` draws the icons and the logo, `web-colors` blends transparency like the design
# boards, `crisp` snaps borders to pixels, `thread-pool` runs the tasks, `advanced` opens the
# widget API for the keyboard focus that iced's buttons lack.
# `x11` and `wayland`: windows on the author's machine (Plasma X11) and under our compositor.
iced = { version = "=0.14.0", optional = true, default-features = false, features = [
    "advanced",
    "tiny-skia",
    "svg",
    "web-colors",
    "crisp",
    "thread-pool",
    "x11",
    "wayland",
] }

[dev-dependencies]
# Headless rendering of the gallery, for the snapshot test and the mouse test.
iced_test = "=0.14.0"
# Windowless interface to run the focus operations in, for the keyboard test. Already pulled
# in by iced: only the declaration is new.
iced_runtime = "=0.14.0"

[[example]]
name = "gallery"
required-features = ["iced"]

[[test]]
name = "gallery"
required-features = ["iced"]

[lints]
workspace = true
