[package]
name = "sherlock-ui"
description = "Colors, radii, typography and components shared by the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The shell programs want the components, so iced is on by default. The compositor, which
# only reads the tokens, goes without it with `default-features = false`.
default = ["iced"]
iced = ["dep:iced", "dep:iced_renderer", "dep:wgpu", "dep:resvg"]

[dependencies]
# Shell toolkit (ADR 0014). Two renderers (ADR 0018): wgpu on the AMD chip, chosen by
# `gpu::Choice` before iced starts, and `tiny-skia` in software when there is no AMD chip or
# when wgpu finds no adapter. `wgpu-bare` takes iced's wgpu renderer without wgpu's backends:
# the `wgpu` dependency below enables Vulkan alone.
# `svg` draws the icons and the logo, `web-colors` blends transparency like the design
# boards, `crisp` snaps borders to pixels, `thread-pool` runs the tasks, `advanced` opens the
# widget API for the keyboard focus that iced's buttons lack.
# `x11` and `wayland`: windows on the author's machine (Plasma X11) and under our compositor.
iced = { version = "=0.14.0", optional = true, default-features = false, features = [
    "advanced",
    "tiny-skia",
    "wgpu-bare",
    "svg",
    "image-without-codecs",
    "web-colors",
    "crisp",
    "thread-pool",
    "x11",
    "wayland",
] }
# The renderer iced picked at start-up, read when drawing a shadow (`surface`). Already pulled
# in by iced: only the declaration is new.
iced_renderer = { version = "=0.14.0", optional = true, default-features = false }
# The version iced 0.14 pulls, with its Vulkan backend only: no OpenGL backend, so no EGL
# vendor library (NVIDIA's comes first on Debian) can ever be loaded (ADR 0018).
wgpu = { version = "=27.0.1", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
] }
# The application icons rasterized here rather than by iced's wgpu renderer, which blends
# resvg's premultiplied pixels as straight alpha and samples them nearest (`raster`, UI-05).
# The version iced already pulls, with the features it enables: nothing new is compiled. iced's
# `image-without-codecs` feature above, which draws them from their pixels without decoding any
# format, is the one Evidence, the lock screen and the notifications already enable.
resvg = { version = "=0.45.1", optional = true, default-features = false }

[dev-dependencies]
# Headless rendering of the gallery, for the snapshot test and the mouse test.
iced_test = "=0.14.0"
# Windowless interface to run the focus operations in, for the keyboard test. Already pulled
# in by iced: only the declaration is new.
iced_runtime = "=0.14.0"
# The gallery follows the theme of the appearance file, like the shell programs.
appearance-config = { path = "../appearance-config" }

[[example]]
name = "gallery"
required-features = ["iced"]

[[test]]
name = "gallery"
required-features = ["iced"]

[[test]]
name = "interaction"
required-features = ["iced"]

[[test]]
name = "raster"
required-features = ["iced"]

[[test]]
name = "fade"
required-features = ["iced"]

# `apply` changes the process environment: one thread, so no libtest harness.
[[test]]
name = "gpu_apply"
harness = false

[lints]
workspace = true
