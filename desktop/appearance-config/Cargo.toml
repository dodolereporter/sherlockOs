[package]
name = "appearance-config"
description = "The appearance settings file: theme and hours of the automatic mode, followed live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The file read with a bound, as every settings file of the desktop.
mime-apps = { path = "../mime-apps" }
# The `Theme` the file chooses: the tokens only, without iced.
sherlock-ui = { path = "../sherlock-ui", default-features = false }
# inotify, timerfd, poll and the local time (localtime_r, mktime): the version the bar and
# Evidence already pin.
libc = "=0.2.191"
# What goes wrong with the file is logged the same way in every program (`follow_themes`).
tracing = "=0.1.44"

[lints]
workspace = true
