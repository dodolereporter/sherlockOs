[package]
name = "compositor"
description = "Wayland compositor of the desktop, written with Smithay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Only the features in use: windowed backend (winit, with GLES rendering), Wayland server,
# desktop tools (Space, Window) and XWayland with its X11 window manager (X11Wm, lot D-13).
# Layer-shell, fractional scale, viewporter and xdg-output (lot D-12) come with
# `wayland_frontend`. The real session (lot D-14): `backend_session_libseat` opens the session
# and the devices (seatd or logind), `backend_udev` finds the cards and sees screens plugged
# in, `backend_drm` drives them (KMS, `DrmCompositor`), `backend_gbm` allocates their buffers
# for the same GLES renderer, `backend_libinput` reads the keyboard, mouse and touchpad.
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }
# Cursor images of the real session, read from the user's cursor theme: the version that
# smithay's winit backend already pulls (through wayland-cursor).
xcursor = "=0.3.11"
# Colors and sizes of the snap preview and of the grab band. Only the tokens: without the
# `iced` feature, the compositor does not build the shell toolkit.
sherlock-ui = { path = "../sherlock-ui", default-features = false }
# Wallpaper setting, shared with Control Room, and the picture of the lock, its curtain (lot
# D-24e), shared with the lock and login screens (workspace crate).
desktop-config = { path = "../desktop-config", features = ["lock-background"] }
# Names of the house cursor themes and of their shapes, without the generator (lot D-07).
cursor-theme = { path = "../cursor-theme" }
# Wallpaper decoders, PNG (the variants) and JPEG (an image chosen by the user) only. Same
# version as evidence.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
# Private protocol of the shell, server side (lot D-18a, ADR 0021).
shell-protocol = { path = "../shell-protocol", features = ["server"] }
# KDE's `org_kde_kwin_appmenu_manager`, server side, for the global menu (lot D-36): the version
# already in the lock, through iced_exwlshell.
wayland-protocols-plasma = { version = "=0.3.12", features = ["server"] }
# `wlr-output-management`, server side (ADR 0025, lot D-26b): the version smithay already pulls
# for layer-shell.
wayland-protocols-wlr = { version = "=0.3.12", features = ["server"] }
# The screens' setting written whole or not at all, as Control Room writes its files.
mime-apps = { path = "../mime-apps" }
# Server-side decorations (lot D-08): ab_glyph lays out and rasterizes the window titles in
# Inter, tiny-skia draws the bar, the pill and the stroked icons. Both are the versions and
# features that smithay's winit backend already pulls (through sctk-adwaita): nothing new is
# built.
ab_glyph = "=0.2.32"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
# The theme of the appearance file, followed live by everything the compositor draws: colors,
# wallpaper and cursors (workspace crate).
appearance-config = { path = "../appearance-config" }
# The media keys (lot D-35): sound, brightness and players, shared with the quick settings of
# the bar (workspace crate), and zbus for their buses, with the version and features it pins.
system-services = { path = "../system-services" }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# The icons of the on-screen display: SVG paths with arcs, which the decorations' own path
# reader does not take. The version iced already pulls for its SVG widget, on the tiny-skia the
# compositor uses, without its text and image features: nothing new is built.
resvg = { version = "=0.45.1", default-features = false }
# X11 client of XWayland: the compositor reads the non-text selections of X11 applications
# itself (lot D-29, `x11_paste.rs`), and the XWayland tests use it as their X11 client. The
# version smithay already pulls for its X11 window manager: nothing new is built.
x11rb = "=0.13.2"
# PR_SET_DUMPABLE (lot D-25k, ADR 0023): no other process of the user may trace this one or
# read its memory, and no core dump is written. A safe call instead of libc's prctl; the version
# the workspace already builds (through wayland and calloop).
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
# Prints the logs on standard error, level set by RUST_LOG.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[dev-dependencies]
# The same smithay, with its renderer for tests (`DummyRenderer`): the damage tests and the
# bench build the scene's elements without a GPU (lot P-01).
smithay = { version = "=0.7.0", default-features = false, features = ["renderer_test"] }
# Wayland client of the integration test: the same crates that smithay already pulls for
# its winit backend. `unstable` for the client side of `zwp_pointer_gestures_v1` (lot D-31).
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
# Client side of KDE's server decoration protocol, for the decoration test: the version that
# smithay already pulls for the server side.
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
# Client side of layer-shell, for the anchored surface of the integration test: the version
# that smithay already pulls for the server side.
wayland-protocols-wlr = { version = "=0.3.12", features = ["client", "server"] }
# Client side of the shell protocol, for its integration test.
shell-protocol = { path = "../shell-protocol", features = ["client"] }
# Client side of KDE's appmenu protocol, for the global menu test.
wayland-protocols-plasma = { version = "=0.3.12", features = ["client", "server"] }

[lints]
workspace = true
