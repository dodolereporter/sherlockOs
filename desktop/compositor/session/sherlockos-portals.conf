# Which portal backend serves each portal in the SherlockOS session (lot D-35b).
# xdg-desktop-portal reads <desktop>-portals.conf, the name of XDG_CURRENT_DESKTOP in lower
# case, from the xdg-desktop-portal folder of each data folder: `just install-session` puts this file in /usr/local/share/sherlockos, which the session
# puts first in XDG_DATA_DIRS. See "Everyday services" in docs/compositor.md.
#
# GTK's backend works without GNOME or Plasma running: files, open with, settings, printing...
# The secrets go to gnome-keyring. Screen sharing and screenshots wait for the compositor to
# offer a capture protocol (wlr-screencopy or ext-image-copy-capture), which Smithay 0.7 lacks.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
