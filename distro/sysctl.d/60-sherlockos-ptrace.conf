# SherlockOS (lot D-25k, ADR 0023): a process may only trace its own descendants, as on Ubuntu
# and Fedora. A program of the user can then no longer read the memory of the lock screen, the
# login screen or the compositor, nor make them act. Debian leaves it at 0. Debuggers still
# start programs; attaching to a running one asks for root (or CAP_SYS_PTRACE).
kernel.yama.ptrace_scope = 1
