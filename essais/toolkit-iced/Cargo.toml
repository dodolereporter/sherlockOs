[package]
name = "toolkit-iced"
version = "0.0.0"
edition = "2024"
publish = false

# Prototype jetable : son propre workspace, hors du workspace principal.
[workspace]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "crisp", "web-colors", "smol"] }
iced_layershell = { version = "=0.19.1", default-features = false }
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
