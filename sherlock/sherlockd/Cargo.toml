[package]
name = "sherlockd"
description = "Daemon of Sherlock, the user session agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Errors with context in the binary (main.rs); the library has typed errors.
anyhow = "=1.0.105"
# JSON-RPC messages of the MCP protocol. serde version already in Cargo.lock.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Async runtime, already in Cargo.lock (pulled by iced). Minimal features: a single thread
# (`rt`), `process` and `io-util` to talk to MCP servers over stdio, `io-std` to serve the proxy
# on standard input and output, `time` for timeouts, `macros` for `#[tokio::main]`,
# `#[tokio::test]` and `select!`.
tokio = { version = "=1.54.1", default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }
tracing = "=0.1.44"
# Prints logs on standard error, level set by RUST_LOG.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[lints]
workspace = true
