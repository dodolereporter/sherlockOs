[package]
name = "sherlockd"
description = "Daemon of Sherlock, the user session agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Errors with context in the binary (main.rs); the library has typed errors.
anyhow = "=1.0.105"
# JSON-RPC messages of the MCP protocol. serde version already in Cargo.lock.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Async runtime, already in Cargo.lock (pulled by iced). Minimal features: a single thread
# (`rt`), `process` and `io-util` to talk to MCP servers over stdio, `io-std` to serve the proxy
# on standard input and output, `time` for timeouts, `macros` for `#[tokio::main]`,
# `#[tokio::test]` and `select!`, `net` for the compositor's consent socket (A-11c).
tokio = { version = "=1.54.1", default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "time",
] }
tracing = "=0.1.44"
# prctl(PR_SET_PDEATHSIG) and kill of a process group: the version the desktop already pins.
libc = "=0.2.191"
# The files server (A-13): openat2 with RESOLVE_BENEATH, and the *at calls on a held folder,
# without unsafe; the peer of the Docker socket (A-14). The version the compositor already pins.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "net", "process"] }
# The services server (A-16): systemd over D-Bus, blocking, on zbus's own executor; the version
# and features the desktop already pins (system-services, Control Room).
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# The settings server (A-17): the settings files by Control Room's own functions, Do not
# disturb, the sound, Wi-Fi and Bluetooth by the services the bar and Control Room use
# (workspace crates).
desktop-config = { path = "../../desktop/desktop-config" }
notifications-config = { path = "../../desktop/notifications-config" }
settings-files = { path = "../../desktop/settings-files" }
system-services = { path = "../../desktop/system-services" }
# Prints logs on standard error, level set by RUST_LOG.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[lints]
workspace = true
