# CI boot: builds the witness image in the build container and boots it in QEMU.
# Fails any pull request whose image does not boot within 90 seconds.
# What is checked and how to run it locally: docs/boot-tests.md.
name: CI boot

on:
  pull_request:
  push:
    branches: [main]

# The token only reads the repository. The cache and the artifacts have their own token.
permissions:
  contents: read

# A new commit on a pull request cancels the run in progress.
# On main, every commit runs to the end.
concurrency:
  group: ci-boot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-boot:
    name: test-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Archive of the build image, outside the repository.
      BUILDER_ARCHIVE: /tmp/sherlockos-builder.tar.zst
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0

      # /dev/kvm exists on GitHub machines, but only the kvm group can open it.
      # builder.sh only passes KVM to the container if the user can open it.
      - name: Open KVM to the user, if it exists
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: QEMU will emulate the processor"
          fi

      # The build image is cached, compressed, under a key made from the Dockerfile and the
      # uid: that is what makes its fingerprint in builder.sh. A restored image carries the
      # right fingerprint, and builder.sh does not rebuild it.
      - name: Cache key of the build image
        id: key
        run: echo "key=builder-${{ hashFiles('distro/builder/Dockerfile') }}-uid$(id -u)" >>"$GITHUB_OUTPUT"

      - name: Restore the build image
        id: cache-builder
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILDER_ARCHIVE }}
          key: ${{ steps.key.outputs.key }}

      - name: Load the restored build image
        if: steps.cache-builder.outputs.cache-hit == 'true'
        run: zstd -dc "$BUILDER_ARCHIVE" | docker load

      - name: Build the build image
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: just builder

      # As for the Cargo cache, only main saves; pull requests read it back.
      - name: Prepare the build image for the cache
        if: steps.cache-builder.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: docker save sherlockos-builder:local | zstd -T0 -3 -q -o "$BUILDER_ARCHIVE"

      - name: Save the build image
        if: steps.cache-builder.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILDER_ARCHIVE }}
          key: ${{ steps.key.outputs.key }}

      - name: just test-builder
        run: just test-builder

      # The full build of the toolchain is too long for the CI: only its scripts are tested.
      # See docs/system-build.md.
      - name: just test-toolchain
        run: just test-toolchain

      # The build image has no shellcheck; the runner image does.
      - name: shellcheck of the toolchain scripts
        run: |
          shellcheck --version
          shellcheck -s bash -S warning distro/bootstrap/*.sh distro/bootstrap/steps/*.sh

      - name: just test-boot
        run: just test-boot

      - name: just test-bench
        run: just test-bench

      # Screenshots and serial logs, uploaded even on failure to understand why.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-screenshots
          path: |
            distro/tests/output/boot-*/screenshot.png
            distro/tests/output/boot-*/serial.log
          if-no-files-found: warn
          retention-days: 30
