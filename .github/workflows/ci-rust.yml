# CI Rust : marque en échec toute demande de fusion qui ne passe pas `just verifier`.
# Ce qui est vérifié et comment le lancer en local : docs/ci.md.
name: CI Rust

on:
  pull_request:
  push:
    branches: [main]

# Le jeton ne sert qu'à lire le dépôt.
permissions:
  contents: read

# Un nouveau commit sur une demande de fusion annule l'exécution en cours.
# Sur main, chaque commit va au bout.
concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verifier:
    name: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sans argument, rustup installe la version et les composants écrits dans
      # rust-toolchain.toml. Aucune version n'est écrite ici.
      - name: Installe Rust depuis rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version
          cargo fmt --version

      # Le compositeur (smithay) se lie à libxkbcommon, et son test d'intégration charge
      # libwayland-client. L'image ubuntu-24.04 n'a pas leurs paquets de développement.
      # xwayland fournit le binaire Xwayland que lance le test d'intégration de XWayland.
      # Garder cette liste alignée sur les prérequis de CLAUDE.md et docs/ci.md.
      - name: Installe les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev xwayland

      - name: Installe just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0

      # Après l'installation de Rust : la clé du cache contient la version de rustc.
      # Seule main enregistre le cache, les demandes de fusion le relisent.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: just verifier
        run: just verifier
