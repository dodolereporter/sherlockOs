[workspace]
resolver = "3"
members = [
    "desktop/appearance-config",
    "desktop/apps",
    "desktop/autostart",
    "desktop/bar",
    "desktop/clipboard-panel",
    "desktop/compositor",
    "desktop/control-room",
    "desktop/cursor-theme",
    "desktop/desktop-config",
    "desktop/dock",
    "desktop/dock-config",
    "desktop/evidence",
    "desktop/greeter",
    "desktop/icon-theme",
    "desktop/launcher",
    "desktop/lock",
    "desktop/mime-apps",
    "desktop/notifications",
    "desktop/notifications-config",
    "desktop/portal",
    "desktop/settings-files",
    "desktop/sherlock-3d",
    "desktop/sherlock-ui",
    "desktop/shell-protocol",
    "desktop/system-services",
    "desktop/toolkit-theme",
    "sherlock/sherlockd",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
# The code is under the GPL, version 3 or later (LICENSE); the name, the logo and the mascot are
# not (TRADEMARKS.md). Nothing is published on crates.io.
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# An unsafe block inside an unsafe function must stay explicit.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# No unwrap nor expect outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
# Every unsafe carries a SAFETY comment that justifies it.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# Shipped code logs with tracing, never on the standard output.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# The software renderer and the picture decoders, optimized even in the dev profile: in debug,
# the 4K captures of the snapshot tests (the lock screen's above all) took most of the
# 15 minutes the CI gives `just verify`. Only these crates; the workspace stays in debug.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.iced_tiny_skia]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
