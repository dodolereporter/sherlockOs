[workspace]
resolver = "3"
members = [
    "desktop/appearance-config",
    "desktop/apps",
    "desktop/autostart",
    "desktop/bar",
    "desktop/compositor",
    "desktop/control-room",
    "desktop/cursor-theme",
    "desktop/desktop-config",
    "desktop/dock",
    "desktop/dock-config",
    "desktop/evidence",
    "desktop/icon-theme",
    "desktop/launcher",
    "desktop/lock",
    "desktop/mime-apps",
    "desktop/notifications",
    "desktop/notifications-config",
    "desktop/sherlock-3d",
    "desktop/sherlock-ui",
    "desktop/shell-protocol",
    "desktop/system-services",
    "desktop/toolkit-theme",
    "sherlock/sherlockd",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
# The license is not chosen yet: nothing is published on crates.io.
publish = false

[workspace.lints.rust]
# An unsafe block inside an unsafe function must stay explicit.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# No unwrap nor expect outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
# Every unsafe carries a SAFETY comment that justifies it.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# Shipped code logs with tracing, never on the standard output.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
