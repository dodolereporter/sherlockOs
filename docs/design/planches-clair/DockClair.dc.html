<script type="text/x-dc" data-dc-script data-props='{"integre":{"editor":null,"default":null},"$preview":{"width":760,"height":150}}'>
class Component extends DCLogic {
renderVals() {
const noms = ['Fichiers', 'Terminal', 'Éditeur', 'Navigateur', 'Sherlock', 'Labo', 'Conteneurs', 'Jeux', 'Réglages'];
const st = this.state || {};
const p = typeof st.p === 'number' ? st.p : null;
const n = noms.length;
const base = 52;
const max = 1.7;
const portee = 1.2;
const vals = {};
let proche = -1;
let ecart = 99;
for (let i = 0; i < n; i++) {
let k = 1;
if (p !== null) {
const d = p * n - (i + 0.5);
k = 1 + (max - 1) * Math.exp(-(d * d) / (2 * portee * portee));
if (Math.abs(d) < ecart) { ecart = Math.abs(d); proche = i; }
}
vals['t' + i] = Math.round(base * k);
}
vals.etiquette = proche >= 0 ? noms[proche] : '';
vals.etiquetteGauche = (proche >= 0 ? ((proche + 0.5) / n * 100).toFixed(1) : '50') + '%';
vals.etiquetteOpacite = proche >= 0 ? 1 : 0;
vals.fond = this.props.integre ? 'transparent' : '#E9EEF4';
vals.bouge = (e) => {
const r = e.currentTarget.getBoundingClientRect();
if (r.width > 0) {
const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
this.setState({ p: x });
}
};
vals.sort = () => this.setState({ p: null });
return vals;
}
}
</script>
